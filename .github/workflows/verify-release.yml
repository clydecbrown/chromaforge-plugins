# Checks a published release against its source: builds the tag's plug-in here, on the host releases are built on, and
# compares it with the release's .wasm once the signature section is taken out. Run by hand (Actions > Verify a
# release > Run workflow) with a tag such as ccb-dxo-pureraw-v0.2.0. It publishes nothing and has no secrets: the
# job can only read the repository and the release.
#
# The tag's own `xtask plugin` builds the file (a tag from before `rebuild` has no such command), and `main`'s `xtask
# compare` compares it, so every release can be checked with the same code.
name: Verify a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. ccb-dxo-pureraw-v0.2.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The tag looks like a release tag
        run: |
          [[ "$TAG" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?-v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::'$TAG' isn't <plug-in>-v<version>"; exit 1; }

      # `main`'s tools, and the tagged source in its own folder: it builds where the release was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false

      - run: rustup toolchain install # what rust-toolchain.toml names, with wasm32
        working-directory: src
      - run: rustup toolchain install # `main`'s pin, for the comparison, which may be newer than the tag's
        working-directory: tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src
            tools

      - name: The published file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.wasm' --dir published

      - name: Build the tagged plug-in
        working-directory: src
        run: cargo xtask plugin "${TAG%-v*}"

      - name: Compare
        working-directory: tools
        run: cargo xtask compare ../src/target/wasm32-unknown-unknown/release/stamped/*.wasm ../published/*.wasm
