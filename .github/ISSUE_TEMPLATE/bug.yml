name: Bug
description: A plug-in does something wrong
labels: [bug]
body:
  # Keep the options in step with plugins/: one per plug-in, named like its folder (and its label).
  - type: dropdown
    id: plugin
    attributes:
      label: Which plug-in?
      options:
        - ccb-dxo-pureraw
        - Shared code, CI or the repository
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The plug-in's version (Plug-in Manager), Chromaforge's version (About) and your OS.
      placeholder: "plug-in 0.2.0, Chromaforge 26.47.1, macOS 15.1"
    validations:
      required: true
  - type: input
    id: pureraw
    attributes:
      label: DxO PureRAW version
      description: PureRAW ▸ About. Leave it empty when DxO PureRAW isn't involved.
      placeholder: "PureRAW 3.7"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Plug-in log
      description: Plug-in Manager ▸ Log, if it says anything. Remove anything private first.
      render: text
