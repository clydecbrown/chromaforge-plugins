# A tag `<plug-in>-v<version>` (e.g. ccb-dxo-pureraw-v0.1.0) releases that plug-in alone. The tagged commit must be
# on main, and passes the same checks as CI before anything is built for release. `cargo xtask release`
# checks that plugins/<plug-in> exists and that its Cargo.toml version and CHANGELOG.md section match
# the tag, then builds only that plug-in for wasm32-unknown-unknown. The release is titled
# "<display name> plug-in <version>" and carries <plug-in>-<version>.wasm, its .sha256 and the changelog
# section. The .wasm is signed with the author key (the PLUGIN_SIGNING_KEY secret; PLUGIN_SIGNER, a repository
# variable, is the fingerprint it must belong to), and the signed file is checked again before it is published.
# Then index.json on the `index` branch (a branch that holds only that file, so `main` can stay protected; made
# once by hand, never by this workflow) gets that plug-in's entry. Other plug-ins aren't touched.
name: Release

on:
  push:
    tags: ["*-v[0-9]*"]

# One release at a time, so two index.json updates can't race.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before anything is built or published: a release with nowhere to record itself would leave the feed behind.
      # Unauthenticated, so it needs this repository to be public (a private one would report the branch as missing).
      - name: The index branch exists
        run: |
          git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" index >/dev/null ||
            { echo "::error::the index branch doesn't exist. Make it once by hand (README, Releasing); a release never starts a new index"; exit 1; }

      # The feed's current index.json, next to the tagged tree. No checkout keeps the token: only the last step gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: index
          path: feed
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }

      - run: rustup toolchain install # what rust-toolchain.toml names, with wasm32
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # What CI runs, again on the tagged commit: nothing is published that wasn't checked here.
      - name: Check the workspace and the plug-in
        run: |
          cargo xtask check
          cargo xtask plugin "${TAG%-v*}"

      # The only step that gets the signing key. It runs the xtask built by the step above, not `cargo xtask`, so
      # no cargo process (and no build script or proc-macro) is started with the key in its environment, and
      # xtask takes the key out of the environment of every cargo it starts itself.
      - id: build
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNER: ${{ vars.PLUGIN_SIGNER }}
        run: ./target/debug/xtask release "$TAG" --out dist --index feed/index.json --sign

      - name: Check the signature on the file to publish
        env:
          PLUGIN_SIGNER: ${{ vars.PLUGIN_SIGNER }}
          FILE: ${{ steps.build.outputs.file }}
        run: ./target/debug/xtask verify "dist/$FILE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.build.outputs.title }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file dist/notes.md \
            "dist/$FILE" "dist/$FILE.sha256"

      - name: Update index.json on the index branch
        working-directory: feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ../target/debug/xtask index ../dist/release.json --repo "$GITHUB_REPOSITORY" --file index.json
          git add index.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "index: $TAG"
          # The header is the token in another form, which GitHub doesn't mask: mask it, and keep it out of argv.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push "https://github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/index
